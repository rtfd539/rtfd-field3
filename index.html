<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161F2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RTFD Field">
<title>RTFD Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Chroma in this app means response zone. Nothing else is colored. */
:root{
  --bg:#0E141B; --panel:#161F2A; --panel-2:#1E2937; --line:#2C3A4B;
  --ink:#E8EEF4; --dim:#93A4B7; --faint:#61748A;
  --z-fleetwood:#2073D6; --z-lowerie:#E0801A; --z-higherie:#8B62D6;
  --z-greenpond:#17915C; --z-supply:#D33F30; --z-cistern:#00A0B4;
  --z-aid:#5B6B7F; --z-none:#3E4B5C; --lz:#F2C14E;
  --tap:52px; --safe-b:env(safe-area-inset-bottom,0px);
  --display:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #E8EEF4;outline-offset:2px}
#app{display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.topbar h1{margin:0;font-family:var(--display);font-weight:700;font-size:19px;
  letter-spacing:.06em;text-transform:uppercase}
.topbar .sub{font-family:var(--display);font-size:14px;letter-spacing:.14em;
  color:var(--faint);text-transform:uppercase}
.spacer{flex:1}
.netdot{width:9px;height:9px;border-radius:50%;background:var(--z-greenpond);flex:0 0 auto}
.netdot[data-net="off"]{background:var(--z-none)}
.qbadge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:99px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--dim)}
.qbadge[hidden]{display:none}
#view{flex:1 1 auto;position:relative;overflow:hidden}
.tabs{display:flex;flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)}
.tabs button{flex:1;min-height:var(--tap);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:6px 4px;color:var(--faint);font-family:var(--display);
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-top:2px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}

.pane{position:absolute;inset:0;display:flex;flex-direction:column}
.searchrow{display:flex;flex:0 0 auto;gap:8px;padding:8px 12px 6px;background:var(--panel)}
.searchrow input{flex:1;min-height:44px;padding:0 12px;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;font-family:var(--body);font-size:16px}
.searchrow input::placeholder{color:var(--faint)}
.chips{display:flex;flex:0 0 auto;gap:6px;overflow-x:auto;padding:0 12px 8px;
  background:var(--panel);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--line);
  border-radius:99px;font-family:var(--display);font-size:14px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px}
.chips button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--dim)}
.chips i{width:9px;height:9px;border-radius:50%;background:var(--z-none)}
.chips .sep{flex:0 0 auto;width:1px;background:var(--line);margin:5px 3px;align-self:stretch}
.cisb{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#0E141B;
  background:var(--z-cistern);border-radius:3px;padding:1px 5px}
.aidb{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink);
  background:var(--z-aid);border-radius:3px;padding:1px 5px}
.segmented{display:flex;flex:0 0 auto;padding:0 12px 8px;background:var(--panel);
  border-bottom:1px solid var(--line)}
.segmented button{flex:1;min-height:38px;font-family:var(--display);font-size:14px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line)}
.segmented button:first-child{border-radius:6px 0 0 6px}
.segmented button:last-child{border-radius:0 6px 6px 0}
.segmented button + button{border-left:0}
.segmented button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.count{flex:0 0 auto;padding:6px 14px;font-family:var(--mono);font-size:11px;color:var(--faint);
  background:var(--bg);border-bottom:1px solid var(--line)}

#map{flex:1 1 auto;background:#0B1016}
.leaflet-container{background:#0B1016;font-family:var(--body)}
.leaflet-control-attribution{background:rgba(14,20,27,.8)!important;color:var(--faint)!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.pin{border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.cispin{display:block;width:14px;height:14px;background:var(--z-cistern);
  border:2px solid rgba(255,255,255,.85);border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.lzpin{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
  background:var(--lz);color:#12100A;border:2px solid rgba(255,255,255,.9);border-radius:4px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5);font-family:var(--display);font-weight:700;font-size:14px;
  line-height:1}

/* LZ cards read as pads, not rows in a table */
.lzcard{display:grid;grid-template-columns:4px 1fr auto;align-items:center;gap:0 14px;
  width:100%;text-align:left;border-bottom:1px solid var(--line);min-height:84px;padding:0}
.lzcard:active{background:var(--panel)}
.lzcard .bar{align-self:stretch;background:var(--lz)}
.lzcard .body{display:block;padding:14px 0;min-width:0}
.lzcard .name{display:block;font-family:var(--display);font-weight:600;font-size:22px;
  line-height:1.15;letter-spacing:.01em}
.lzcard .addr{display:block;color:var(--dim);font-size:14px;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.lzcard .note{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);
  margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.lzcard .range{padding-right:14px;text-align:right}
.lzcard .dist{display:block;font-family:var(--mono);font-size:17px;font-weight:600}
.lzcard .meta{display:block;font-family:var(--mono);font-size:11px;color:var(--faint)}
.lzcard .bearing{display:block;margin:2px 0 0 auto;width:26px;height:26px;stroke:var(--dim);
  fill:none;stroke-width:2;transition:transform .25s ease}
@media (prefers-reduced-motion:reduce){.lzcard .bearing{transition:none}}

/* the coordinate block is the point of this screen — big enough to read aloud */
.coord{margin-top:16px;padding:16px;border-radius:8px;background:var(--bg);
  border:1px solid var(--line);text-align:center}
.coord .lab{font-family:var(--display);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint)}
.coord .val{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.35;
  margin-top:8px;letter-spacing:.01em;word-spacing:.1em}
.coord .hint{font-size:12px;color:var(--faint);margin-top:8px}

.list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.card{display:grid;grid-template-columns:6px 1fr auto;align-items:center;gap:0 14px;width:100%;
  text-align:left;padding:0;border-bottom:1px solid var(--line);min-height:78px}
.card:active{background:var(--panel)}
.flag{align-self:stretch;background:var(--z-none)}
.flag[data-zone="Fleetwood"]{background:var(--z-fleetwood)}
.flag[data-zone="Low Erie"]{background:var(--z-lowerie)}
.flag[data-zone="High Erie"]{background:var(--z-higherie)}
.flag[data-zone="Green Pond"]{background:var(--z-greenpond)}
.flag[data-zone="Supply"]{background:var(--z-supply)}
.flag[data-zone="Cistern"]{background:var(--z-cistern)}
.flag[data-zone="Rockaway Boro"],.flag[data-zone="Dover"],
.flag[data-zone="Wharton"],.flag[data-zone="Denville"]{background:var(--z-aid)}
.card .body{padding:12px 0;min-width:0}
.card .unit{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;
  letter-spacing:.02em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .unit.long{font-size:20px}
.card .unit.xlong{font-size:17px}
.card .unit.unset{color:var(--faint)}
.card .street{color:var(--dim);font-size:14px;margin-top:4px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
.warn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#0E141B;
  background:var(--z-lowerie);border-radius:3px;padding:1px 5px;vertical-align:middle}
.oosb{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#fff;
  background:var(--z-supply);border-radius:3px;padding:1px 5px}
.card .range{padding-right:14px;text-align:right}
.card .dist{font-family:var(--mono);font-size:17px;font-weight:600}
.card .bearing{display:block;margin:2px 0 0 auto;width:26px;height:26px;stroke:var(--dim);
  fill:none;stroke-width:2;transition:transform .25s ease}
@media (prefers-reduced-motion:reduce){.card .bearing{transition:none}}
.empty{padding:36px 24px;text-align:center;color:var(--dim)}
.empty strong{display:block;font-family:var(--display);font-size:20px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);margin-bottom:6px}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;z-index:1000;
  background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  padding:14px 16px calc(18px + var(--safe-b));transform:translateY(101%);
  transition:transform .22s ease;box-shadow:0 -12px 30px rgba(0,0,0,.45)}
.sheet.open{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;
  word-break:break-word}
.sheet-head h2.long{font-size:24px}
.sheet-head .street{color:var(--dim);margin-top:4px}
.closeb{min-width:44px;min-height:44px;font-size:22px;color:var(--dim);margin-left:auto}
.alert{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--panel-2);
  border-left:3px solid var(--z-lowerie);font-size:14px;color:var(--dim)}
.fldlab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:16px 0 0}
.zonerow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.zonerow button{flex:1 1 28%;min-height:42px;border:1px solid var(--line);border-radius:6px;
  font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--dim)}
.zonerow button[aria-pressed="true"]{color:#fff;border-color:transparent}
.zonerow button[aria-pressed="true"]{background:var(--z-aid)}
.zonerow button[data-zone="Cistern"][aria-pressed="true"]{background:var(--z-cistern)}
.zonerow button[data-zone="Fleetwood"][aria-pressed="true"]{background:var(--z-fleetwood)}
.zonerow button[data-zone="Low Erie"][aria-pressed="true"]{background:var(--z-lowerie)}
.zonerow button[data-zone="High Erie"][aria-pressed="true"]{background:var(--z-higherie)}
.zonerow button[data-zone="Green Pond"][aria-pressed="true"]{background:var(--z-greenpond)}
.zonerow button[data-zone="Supply"][aria-pressed="true"]{background:var(--z-supply)}
label.fld{display:block;margin-top:14px}
label.fld span{display:block;font-family:var(--display);font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px}
label.fld input,label.fld textarea,label.fld select{width:100%;min-height:46px;padding:10px 12px;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;
  font-family:var(--body);font-size:16px}
label.fld textarea{min-height:70px;resize:vertical}
label.fld input.big{font-family:var(--display);font-size:26px;font-weight:700}
.two{display:flex;gap:8px}
.two label.fld{flex:1}
.oos{display:flex;align-items:center;gap:10px;margin-top:16px;min-height:var(--tap)}
.oos input{width:22px;height:22px;accent-color:var(--z-supply)}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;min-height:var(--tap);border-radius:6px;border:1px solid var(--line);
  font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.btn.primary{background:var(--ink);color:#0E141B;border-color:var(--ink);font-weight:600}
.btn.ghost{color:var(--dim)}
.btn:disabled{opacity:.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:16px;
  font-family:var(--mono);font-size:12px;color:var(--faint)}
.kv b{font-weight:400}
.kv span{color:var(--dim)}

.settings{padding:16px 16px calc(24px + var(--safe-b));overflow-y:auto}
.settings h2{font-family:var(--display);font-size:15px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:26px 0 10px;font-weight:600}
.settings h2:first-child{margin-top:4px}
.settings p{color:var(--dim);margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .lab{flex:1}
.row .lab b{display:block;font-weight:600}
.row .lab small{color:var(--faint)}
.row .val{font-family:var(--mono);font-size:13px;color:var(--dim)}
.row .sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.7)}
.toast{position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:11px 16px;
  border-radius:8px;font-size:14px;z-index:2000;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;max-width:88vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  'dupXY':'Another record sits at the same coordinates.'
};

/* ---------- storage ---------- */
var DB = (function () {
  var _db = null;
  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise(function (res, rej) {
      var rq = indexedDB.open('rtfd-field', 1);
      rq.onupgradeneeded = function () {
        var d = rq.result;
        if (!d.objectStoreNames.contains('records')) {
          var s = d.createObjectStore('records',{keyPath:'_key'});
          s.createIndex('module','_module',{unique:false});
        }
        if (!d.objectStoreNames.contains('queue')) d.createObjectStore('queue',{keyPath:'qid',autoIncrement:true});
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
      };
      rq.onsuccess = function () { _db = rq.result; res(_db); };
      rq.onerror = function () { rej(rq.error); };
    });
  }
  function tx(store, mode, fn) {
    return open().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(store, mode), s = t.objectStore(store), out;
        try { out = fn(s); } catch (e) { rej(e); return; }
        t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { rej(t.error); };
        t.onabort = function () { rej(t.error); };
      });
    });
  }
  function strip(r) { var o={}; for (var k in r) if (k!=='_key' && k!=='_module') o[k]=r[k]; return o; }
  return {
    putRecords: function (m, rows) {
      return tx('records','readwrite',function (s) {
        rows.forEach(function (r) { var c=Object.assign({},r); c._key=m+':'+r.id; c._module=m; s.put(c); });
      });
    },
    putRecord: function (m, r) {
      return tx('records','readwrite',function (s) { var c=Object.assign({},r); c._key=m+':'+r.id; c._module=m; s.put(c); });
    },
    getRecords: function (m) {
      return tx('records','readonly',function (s) { return s.index('module').getAll(m); })
        .then(function (rows) { return (rows||[]).map(strip); });
    },
    clearModule: function (m) {
      return tx('records','readwrite',function (s) {
        var rq = s.index('module').getAllKeys(m);
        rq.onsuccess = function () { rq.result.forEach(function (k) { s.delete(k); }); };
      });
    },
    enqueue: function (m,id,p) { return tx('queue','readwrite',function (s) { s.add({module:m,id:id,patch:p,at:Date.now()}); }); },
    queued: function () { return tx('queue','readonly',function (s) { return s.getAll(); }).then(function (r) { return r||[]; }); },
    queueCount: function () { return tx('queue','readonly',function (s) { return s.count(); }).then(function (n) { return n||0; }); },
    dequeue: function (ids) { return tx('queue','readwrite',function (s) { ids.forEach(function (q) { s.delete(q); }); }); },
    setMeta: function (k,v) { return tx('meta','readwrite',function (s) { s.put({k:k,v:v}); }); },
    getMeta: function (k,d) { return tx('meta','readonly',function (s) { return s.get(k); })
      .then(function (r) { return r ? r.v : (d===undefined?null:d); }); }
  };
})();

/* ---------- sync ---------- */
var SYNC = (function () {
  var endpoint = '';
  function conf() { return !!endpoint; }
  function run(module) {
    if (!conf()) return Promise.reject(new Error('No sync endpoint set. Add it in Setup.'));
    if (!navigator.onLine) return Promise.reject(new Error('No connection.'));
    return DB.queued().then(function (all) {
      var pending = all.filter(function (q) { return q.module === module; });
      var push = pending.length ? fetch(endpoint,{method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({module:module,edits:pending.map(function (q) {
          return {id:q.id,patch:q.patch,at:q.at}; })})
      }).then(function (r) { if (!r.ok) throw new Error('Push failed ('+r.status+')'); return r.json(); })
        .then(function (o) { if (!o.ok) throw new Error(o.error||'Push rejected');
          return DB.dequeue(pending.map(function (q) { return q.qid; })); }) : Promise.resolve();
      return push.then(function () { return DB.getMeta('sync:'+module,''); }).then(function (since) {
        return fetch(endpoint+'?module='+encodeURIComponent(module)+(since?'&since='+encodeURIComponent(since):''))
          .then(function (r) { if (!r.ok) throw new Error('Pull failed ('+r.status+')'); return r.json(); });
      }).then(function (data) {
        var rows = data.rows || [];
        return (rows.length ? DB.putRecords(module,rows) : Promise.resolve())
          .then(function () { return DB.setMeta('sync:'+module, data.now||new Date().toISOString()); })
          .then(function () { return {pushed:pending.length,pulled:rows.length}; });
      });
    });
  }
  return {run:run, configured:conf,
    setEndpoint:function (v) { endpoint=v; }, getEndpoint:function () { return endpoint; },
    edit:function (m,id,p) {
      return DB.enqueue(m,id,p).then(function () {
        if (conf() && navigator.onLine) return run(m).catch(function () { return null; });
        return null;
      });
    }};
})();

/* ---------- geo ---------- */
var R_FT=20902231, rad=function (d) { return d*Math.PI/180; };
function distanceFt(a,b) {
  var dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  var s=Math.pow(Math.sin(dLat/2),2)+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.pow(Math.sin(dLon/2),2);
  return 2*R_FT*Math.asin(Math.min(1,Math.sqrt(s)));
}
function bearingDeg(a,b) {
  var y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat));
  var x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function fmtDist(ft) { return ft<1000 ? Math.round(ft/10)*10+' ft' : (ft/5280).toFixed(ft<5280?2:1)+' mi'; }
function compass(d) { return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16]; }

function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g,function (c) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastEl=document.getElementById('toast'), toastT=null;
function say(msg) {
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function () { toastEl.classList.remove('show'); },3200);
}

/* When a new data file ships, the seed replaces what's on the device — but any
   record the user edited here (it has an `updated` stamp) keeps its edits, and
   anything still queued to send is left untouched. Without this, a device that
   already had records would sit on the old file forever. */
function seedModule(module, metaKey, version, seed, fields) {
  return DB.getMeta(metaKey,'').then(function (v) {
    if (v === version) return DB.getRecords(module);
    return DB.getRecords(module).then(function (existing) {
      var edited = {};
      existing.forEach(function (r) { if (r.updated) edited[r.id] = r; });
      var merged = seed.map(function (r) {
        var e = edited[r.id];
        if (!e) return r;
        var out = Object.assign({}, r);
        fields.forEach(function (f) { if (e[f] !== undefined && e[f] !== '') out[f] = e[f]; });
        out.updated = e.updated;
        return out;
      });
      // an edited record the new file dropped is still worth keeping
      var ids = {};
      seed.forEach(function (r) { ids[r.id] = 1; });
      existing.forEach(function (r) { if (r.updated && !ids[r.id]) merged.push(r); });
      return DB.clearModule(module)
        .then(function () { return DB.putRecords(module, merged); })
        .then(function () { return DB.setMeta(metaKey, version); })
        .then(function () { return merged; });
    });
  });
}

/* ============================================================
   HYDRANTS
   ============================================================ */
var HYD = (function () {
  var rows=[], map=null, layer=null, meMarker=null;
  var here=null, watchId=null, mode='near', query='', zoneFilter='';
  var flagOnly=false, aidOnly=false, townOnly=false, open=null, el=null;

  function mount(root) {
    el = root;
    el.innerHTML =
      '<div class="pane">' +
        '<div class="searchrow"><input id="h-q" type="search" inputmode="search" autocomplete="off" ' +
          'placeholder="Number, street or zone" value="'+esc(query)+'"></div>' +
        '<div class="chips" id="h-chips"></div>' +
        '<div class="segmented" role="group" aria-label="View">' +
          '<button id="h-near" aria-pressed="true">Nearest</button>' +
          '<button id="h-map" aria-pressed="false">Map</button></div>' +
        '<div class="count" id="h-count"></div>' +
        '<div class="list" id="h-list"></div>' +
        '<div id="map" hidden></div>' +
        '<div class="sheet" id="h-sheet" role="dialog" aria-label="Hydrant detail"></div>' +
      '</div>';

    function chip(z) {
      return '<button data-f="zone" data-zone="'+esc(z)+'" aria-pressed="'+(zoneFilter===z)+'">' +
        '<i style="background:'+ZCOLOR[z]+'"></i>'+esc(z)+'</button>';
    }
    el.querySelector('#h-chips').innerHTML =
      '<button data-f="all" aria-pressed="'+(!zoneFilter&&!flagOnly&&!aidOnly)+'">All</button>' +
      '<button data-f="town" aria-pressed="'+(townOnly)+'">In town</button>' +
      TOWN_ZONES.map(chip).join('') +
      '<span class="sep"></span>' +
      '<button data-f="aid" aria-pressed="'+aidOnly+'">Mutual aid</button>' +
      AID_ZONES.map(chip).join('') +
      '<span class="sep"></span>' +
      '<button data-f="flag" aria-pressed="'+flagOnly+'">Needs review</button>';

    el.querySelector('#h-chips').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var f = b.getAttribute('data-f');
      if (f === 'all') { zoneFilter=''; flagOnly=false; aidOnly=false; townOnly=false; }
      else if (f === 'zone') { var z=b.getAttribute('data-zone');
        zoneFilter = (zoneFilter===z ? '' : z); flagOnly=false; aidOnly=false; townOnly=false; }
      else if (f === 'aid') { aidOnly = !aidOnly; townOnly=false; zoneFilter=''; flagOnly=false; }
      else if (f === 'town') { townOnly = !townOnly; aidOnly=false; zoneFilter=''; flagOnly=false; }
      else { flagOnly = !flagOnly; zoneFilter=''; aidOnly=false; townOnly=false; }
      paintChips();
      if (mode==='near') renderList(); else drawPins();
    });

    el.querySelector('#h-q').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      if (mode==='near') renderList(); else drawPins();
    });
    el.querySelector('#h-near').addEventListener('click', function () { setMode('near'); });
    el.querySelector('#h-map').addEventListener('click', function () { setMode('map'); });

    return seedModule('hydrants','seed',SEED_VERSION,SEED,
      ['unit','zone','size','cap','own','notes','status']).then(function (r) {
      rows = r;
      startWatch();
      setMode(mode);
    });
  }

  function unmount() {
    if (watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    watchId=null;
    if (map) { map.remove(); map=null; layer=null; meMarker=null; }
    el=null;
  }

  function paintChips() {
    Array.prototype.forEach.call(el.querySelectorAll('#h-chips button'), function (b) {
      var f=b.getAttribute('data-f'), on;
      if (f==='all') on = !zoneFilter && !flagOnly && !aidOnly && !townOnly;
      else if (f==='zone') on = zoneFilter===b.getAttribute('data-zone');
      else if (f==='aid') on = aidOnly;
      else if (f==='town') on = townOnly;
      else on = flagOnly;
      b.setAttribute('aria-pressed', on);
    });
  }

  function startWatch() {
    if (!navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(function (p) {
      here={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
      drawMe(); if (mode==='near') renderList();
    }, function () { say('Location unavailable — sorted by number instead.'); },
      {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }

  function setMode(m) {
    mode=m;
    el.querySelector('#h-near').setAttribute('aria-pressed', m==='near');
    el.querySelector('#h-map').setAttribute('aria-pressed', m==='map');
    el.querySelector('#h-list').hidden = m!=='near';
    el.querySelector('#map').hidden = m!=='map';
    if (m==='near') renderList(); else showMap();
  }

  function matches(h) {
    if (zoneFilter && h.zone !== zoneFilter) return false;
    if (aidOnly && !isAid(h.zone)) return false;
    if (townOnly && isAid(h.zone)) return false;
    if (flagOnly && !h.flags) return false;
    if (!query) return true;
    return (h.unit||'').toLowerCase().indexOf(query)>-1 ||
           (h.street||'').toLowerCase().indexOf(query)>-1 ||
           (h.zone||'').toLowerCase().indexOf(query)>-1 ||
           (h.sys||'').toLowerCase().indexOf(query)>-1 ||
           (h.notes||'').toLowerCase().indexOf(query)>-1;
  }

  function renderList() {
    var list=el.querySelector('#h-list');
    var out=rows.filter(matches), total=out.length;
    if (here) {
      out.forEach(function (h) { h._d=distanceFt(here,h); h._b=bearingDeg(here,h); });
      out.sort(function (a,b) { return a._d-b._d; });
    } else {
      out.sort(function (a,b) { return String(a.unit).localeCompare(String(b.unit)); });
    }
    out=out.slice(0,80);
    el.querySelector('#h-count').textContent =
      total + (total===1?' record':' records') +
      (total>out.length ? (here ? ' — nearest '+out.length : ' — first '+out.length+' by number') : '') +
      (here ? '' : ' — waiting on GPS');
    if (!out.length) {
      list.innerHTML='<div class="empty"><strong>Nothing matches</strong>'+
        'Try a hydrant number, street or zone, or clear the filters.</div>';
      return;
    }
    list.innerHTML=out.map(card).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.card'), function (b) {
      b.addEventListener('click', function () { openSheet(b.getAttribute('data-id')); });
    });
  }

  function sizeClass(u) {
    var n = (u||'').length;
    return n > 16 ? ' xlong' : n > 10 ? ' long' : '';
  }

  function card(h) {
    var oos=h.status==='oos';
    var range = here ? '<div class="dist">'+fmtDist(h._d)+'</div>'+
      '<svg class="bearing" viewBox="0 0 24 24" style="transform:rotate('+Math.round(h._b)+'deg)">'+
      '<path d="M12 3v18M12 3l-5 6M12 3l5 6"/></svg>'+
      '<div class="meta">'+compass(h._b)+'</div>' : '';
    var cis = h.zone==='Cistern';
    var meta = cis
      ? 'Cistern' + (h.cap ? ' &middot; '+Number(h.cap).toLocaleString()+' gal' : ' &middot; capacity unknown')
      : esc(h.zone||'no zone') +
        (h.size?' &middot; '+esc(h.size):'') +
        (h.own?' &middot; '+(h.own==='M'?'Municipal':'Private'):'') +
        (h.sys && h.sys!=='Rockaway Township' ? ' &middot; '+esc(h.sys) : '');
    return '<button class="card" data-id="'+esc(h.id)+'">'+
      '<i class="flag" data-zone="'+esc(h.zone)+'"></i>'+
      '<span class="body">'+
        '<span class="unit'+(h.unit?'':' unset')+sizeClass(h.unit)+'">'+esc(h.unit||'no number')+
          (oos?' <b class="oosb">OOS</b>':'')+
          (cis?' <b class="cisb">CIS</b>':'')+
          (h.flags?' <b class="warn">!</b>':'')+'</span>'+
        '<span class="street">'+esc(h.street||'')+'</span>'+
        '<span class="meta">'+meta+'</span>'+
      '</span><span class="range">'+range+'</span></button>';
  }

  function showMap() {
    if (typeof L === 'undefined') {
      el.querySelector('#map').innerHTML='<div class="empty"><strong>Map needs a connection</strong>'+
        'The nearest list still works.</div>';
      return;
    }
    if (!map) {
      map=L.map('map',{zoomControl:false,preferCanvas:true})
        .setView(here?[here.lat,here.lon]:center(), here?17:13);
      L.control.zoom({position:'topright'}).addTo(map);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
      layer=L.layerGroup().addTo(map);
    }
    setTimeout(function () { map.invalidateSize(); },60);
    drawPins(); drawMe();
  }

  function center() {
    if (!rows.length) return [40.92,-74.53];
    var la=0,lo=0;
    rows.forEach(function (h) { la+=h.lat; lo+=h.lon; });
    return [la/rows.length,lo/rows.length];
  }

  function drawPins() {
    if (!layer) return;
    layer.clearLayers();
    var shown = rows.filter(matches);
    el.querySelector('#h-count').textContent =
      shown.length + (shown.length===1?' record':' records') + ' shown';
    shown.forEach(function (h) {
      var oos=h.status==='oos', cis=h.zone==='Cistern';
      var m;
      if (cis) {
        // static water, not a pressurized hydrant — square marker, fixed screen size
        m = L.marker([h.lat,h.lon], {icon: L.divIcon({
          className:'', iconSize:[14,14], iconAnchor:[7,7],
          html:'<span class="cispin" style="opacity:'+(oos?.35:1)+'"></span>'
        })});
      } else {
        m = L.circleMarker([h.lat,h.lon], {radius:5, weight:1.5,
          color:'rgba(255,255,255,.7)', fillColor:ZCOLOR[h.zone]||ZCOLOR[''],
          fillOpacity:oos?.3:.95, className:'pin'});
      }
      m.on('click',function () { openSheet(h.id); });
      m.addTo(layer);
    });
  }

  function drawMe() {
    if (!map || !here) return;
    if (!meMarker) meMarker=L.circleMarker([here.lat,here.lon],
      {radius:6,weight:3,color:'#E8EEF4',fillColor:'#E8EEF4',fillOpacity:.3}).addTo(map);
    else meMarker.setLatLng([here.lat,here.lon]);
  }

  function openSheet(hid) {
    var h=null;
    rows.forEach(function (r) { if (String(r.id)===String(hid)) h=r; });
    if (!h) return;
    open=h;
    var sheet=el.querySelector('#h-sheet');
    var alerts=(h.flags?h.flags.split(','):[]).map(function (f) {
      return '<div class="alert">'+esc(FLAGTEXT[f]||f)+'</div>'; }).join('');
    sheet.innerHTML=
      '<div class="sheet-head"><div><h2'+((h.unit||'').length>14?' class="long"':'')+'>'+
        esc(h.unit||'No number')+'</h2>'+
        '<div class="street">'+esc(h.street||'')+'</div></div>'+
        '<button class="closeb" id="h-x" aria-label="Close">&times;</button></div>'+
      alerts+
      '<label class="fld"><span>Hydrant number</span>'+
        '<input id="f-unit" class="big" value="'+esc(h.unit||'')+'"></label>'+
      '<div class="fldlab">Zone</div><div class="zonerow" id="f-zone">'+
        ZONES.map(function (z) {
          return '<button data-zone="'+esc(z)+'" aria-pressed="'+(h.zone===z)+'">'+esc(z)+'</button>';
        }).join('')+'</div>'+
      '<div class="two">'+
        (h.zone==='Cistern'
          ? '<label class="fld"><span>Capacity (gal)</span>'+
            '<input id="f-cap" inputmode="numeric" value="'+esc(h.cap||'')+'"></label>'
          : '<label class="fld"><span>Main size</span>'+
            '<input id="f-size" value="'+esc(h.size||'')+'" placeholder="8&quot;"></label>')+
        '<label class="fld"><span>Owner</span><select id="f-own">'+
          '<option value=""'+(h.own?'':' selected')+'>—</option>'+
          '<option value="M"'+(h.own==='M'?' selected':'')+'>Municipal</option>'+
          '<option value="P"'+(h.own==='P'?' selected':'')+'>Private</option>'+
        '</select></label></div>'+
      '<label class="fld"><span>Notes</span><textarea id="f-notes" '+
        'placeholder="Access, steamer direction, seasonal issues">'+esc(h.notes||'')+'</textarea></label>'+
      '<label class="oos"><input type="checkbox" id="f-oos"'+(h.status==='oos'?' checked':'')+
        '><span>Out of service</span></label>'+
      '<div class="actions"><button class="btn ghost" id="f-nav">Directions</button>'+
        '<button class="btn primary" id="f-save">Save</button></div>'+
      '<div class="kv"><b>record</b><span>'+esc(h.id)+'</span>'+
        '<b>system</b><span>'+esc(h.sys||'—')+'</span>'+
        '<b>coords</b><span>'+Number(h.lat).toFixed(5)+', '+Number(h.lon).toFixed(5)+'</span>'+
        '<b>updated</b><span>'+esc(h.updated||'never')+'</span></div>';
    sheet.classList.add('open');

    sheet.querySelector('#h-x').onclick=closeSheet;
    Array.prototype.forEach.call(sheet.querySelectorAll('#f-zone button'), function (b) {
      b.onclick=function () {
        var was=b.getAttribute('aria-pressed')==='true';
        Array.prototype.forEach.call(sheet.querySelectorAll('#f-zone button'), function (x) {
          x.setAttribute('aria-pressed', !was && x===b);
        });
      };
    });
    sheet.querySelector('#f-nav').onclick=function () {
      window.open('https://www.google.com/maps/dir/?api=1&destination='+h.lat+','+h.lon,'_blank');
    };
    sheet.querySelector('#f-save').onclick=save;
  }

  function closeSheet() {
    var sheet=el&&el.querySelector('#h-sheet');
    if (sheet) sheet.classList.remove('open');
    open=null;
  }

  function save() {
    if (!open) return;
    var sheet=el.querySelector('#h-sheet');
    sheet.querySelector('#f-save').disabled=true;
    var z=sheet.querySelector('#f-zone button[aria-pressed="true"]');
    var sizeEl=sheet.querySelector('#f-size'), capEl=sheet.querySelector('#f-cap');
    var patch={
      unit:sheet.querySelector('#f-unit').value.trim(),
      zone:z?z.getAttribute('data-zone'):'',
      own:sheet.querySelector('#f-own').value,
      notes:sheet.querySelector('#f-notes').value.trim(),
      status:sheet.querySelector('#f-oos').checked?'oos':'ok',
      updated:new Date().toISOString().slice(0,16).replace('T',' ')
    };
    if (sizeEl) patch.size = sizeEl.value.trim();
    if (capEl) patch.cap = parseInt(capEl.value,10) || '';
    Object.assign(open,patch);
    var rec=open;
    DB.putRecord('hydrants',rec)
      .then(function () { return SYNC.edit('hydrants',rec.id,patch); })
      .then(function (res) {
        closeSheet();
        if (mode==='near') renderList(); else drawPins();
        say(res?'Saved and synced.':'Saved on this device.');
        paintQueue();
      });
  }

  function reload() {
    return DB.getRecords('hydrants').then(function (r) {
      rows=r;
      if (el) { if (mode==='near') renderList(); else drawPins(); }
    });
  }
  function all() { return rows; }

  return {id:'hydrants', title:'Hydrants',
    icon:'<svg viewBox="0 0 24 24"><path d="M9 21h6M8 21V10a4 4 0 0 1 8 0v11M6 12h2M16 12h2M9 6h6M12 6V4"/></svg>',
    mount:mount, unmount:unmount, reload:reload, all:all};
})();

/* ============================================================
   LANDING ZONES
   ============================================================ */
var LZ = (function () {
  var rows=[], map=null, layer=null, meMarker=null;
  var here=null, watchId=null, mode='near', query='', open=null, el=null;

  function mount(root) {
    el = root;
    el.innerHTML =
      '<div class="pane">' +
        '<div class="searchrow"><input id="l-q" type="search" inputmode="search" autocomplete="off" ' +
          'placeholder="Name or address" value="'+esc(query)+'"></div>' +
        '<div class="segmented" role="group" aria-label="View">' +
          '<button id="l-near" aria-pressed="true">Nearest</button>' +
          '<button id="l-map" aria-pressed="false">Map</button></div>' +
        '<div class="count" id="l-count"></div>' +
        '<div class="list" id="l-list"></div>' +
        '<div id="lzmap" style="flex:1 1 auto;background:#0B1016" hidden></div>' +
        '<div class="sheet" id="l-sheet" role="dialog" aria-label="Landing zone detail"></div>' +
      '</div>';

    el.querySelector('#l-q').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      if (mode==='near') renderList(); else drawPins();
    });
    el.querySelector('#l-near').addEventListener('click', function () { setMode('near'); });
    el.querySelector('#l-map').addEventListener('click', function () { setMode('map'); });

    return seedModule('lz','lzseed',LZ_VERSION,LZ_SEED,['notes']).then(function (r) {
      rows = r;
      startWatch();
      setMode(mode);
    });
  }

  function unmount() {
    if (watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    watchId=null;
    if (map) { map.remove(); map=null; layer=null; meMarker=null; }
    el=null;
  }

  function startWatch() {
    if (!navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(function (p) {
      here={lat:p.coords.latitude,lon:p.coords.longitude};
      drawMe(); if (mode==='near') renderList();
    }, function () {}, {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }

  function setMode(m) {
    mode=m;
    el.querySelector('#l-near').setAttribute('aria-pressed', m==='near');
    el.querySelector('#l-map').setAttribute('aria-pressed', m==='map');
    el.querySelector('#l-list').hidden = m!=='near';
    el.querySelector('#lzmap').hidden = m!=='map';
    if (m==='near') renderList(); else showMap();
  }

  function matches(z) {
    if (!query) return true;
    return (z.name||'').toLowerCase().indexOf(query)>-1 ||
           (z.addr||'').toLowerCase().indexOf(query)>-1 ||
           (z.notes||'').toLowerCase().indexOf(query)>-1;
  }

  function renderList() {
    var list=el.querySelector('#l-list');
    var out=rows.filter(matches);
    if (here) {
      out.forEach(function (z) { z._d=distanceFt(here,z); z._b=bearingDeg(here,z); });
      out.sort(function (a,b) { return a._d-b._d; });
    } else {
      out.sort(function (a,b) { return (a.name||'').localeCompare(b.name||''); });
    }
    el.querySelector('#l-count').textContent =
      out.length + (out.length===1?' landing zone':' landing zones') +
      (here ? '' : ' — waiting on GPS');
    if (!out.length) {
      list.innerHTML='<div class="empty"><strong>Nothing matches</strong>'+
        'Try a school, field or road name.</div>';
      return;
    }
    list.innerHTML=out.map(card).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.lzcard'), function (b) {
      b.addEventListener('click', function () { openSheet(b.getAttribute('data-id')); });
    });
  }

  // strip ", NJ 07866" — every zone is in NJ, and the town is the useful part
  function shortAddr(a) {
    return String(a||'').replace(/,?\s*NJ\s*\d{5}(-\d{4})?\s*$/i,'');
  }

  function card(z) {
    var range = here ? '<span class="range"><span class="dist">'+fmtDist(z._d)+'</span>'+
      '<svg class="bearing" viewBox="0 0 24 24" style="transform:rotate('+Math.round(z._b)+'deg)">'+
      '<path d="M12 3v18M12 3l-5 6M12 3l5 6"/></svg>'+
      '<span class="meta">'+compass(z._b)+'</span></span>' : '<span></span>';
    return '<button class="lzcard" data-id="'+esc(z.id)+'">'+
      '<i class="bar"></i>'+
      '<span class="body"><span class="name">'+esc(z.name)+'</span>'+
        '<span class="addr">'+esc(shortAddr(z.addr))+'</span>'+
        (z.notes?'<span class="note">'+esc(z.notes)+'</span>':'')+'</span>'+
      range+'</button>';
  }

  function showMap() {
    if (typeof L === 'undefined') {
      el.querySelector('#lzmap').innerHTML='<div class="empty"><strong>Map needs a connection</strong>'+
        'The nearest list still works.</div>';
      return;
    }
    if (!map) {
      map=L.map('lzmap',{zoomControl:false});
      L.control.zoom({position:'topright'}).addTo(map);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
      layer=L.layerGroup().addTo(map);
      // only 20 pads, spread from Dover to Newfoundland — show them all, not just the nearest
      if (rows.length) {
        var pts = rows.map(function (z) { return [z.lat,z.lon]; });
        if (here) pts.push([here.lat,here.lon]);
        map.fitBounds(L.latLngBounds(pts), {padding:[34,34]});
      } else {
        map.setView(center(), 11);
      }
    }
    setTimeout(function () { map.invalidateSize(); },60);
    drawPins(); drawMe();
  }

  function center() {
    if (!rows.length) return [40.94,-74.51];
    var la=0,lo=0;
    rows.forEach(function (z) { la+=z.lat; lo+=z.lon; });
    return [la/rows.length,lo/rows.length];
  }

  function drawPins() {
    if (!layer) return;
    layer.clearLayers();
    var shown = rows.filter(matches);
    el.querySelector('#l-count').textContent =
      shown.length + (shown.length===1?' landing zone':' landing zones') + ' shown';
    shown.forEach(function (z) {
      var m=L.marker([z.lat,z.lon],{icon:L.divIcon({className:'',iconSize:[22,22],
        iconAnchor:[11,11], html:'<span class="lzpin">H</span>'})});
      m.on('click',function () { openSheet(z.id); });
      m.addTo(layer);
    });
  }

  function drawMe() {
    if (!map || !here) return;
    if (!meMarker) meMarker=L.circleMarker([here.lat,here.lon],
      {radius:6,weight:3,color:'#E8EEF4',fillColor:'#E8EEF4',fillOpacity:.3}).addTo(map);
    else meMarker.setLatLng([here.lat,here.lon]);
  }

  function openSheet(zid) {
    var z=null;
    rows.forEach(function (r) { if (String(r.id)===String(zid)) z=r; });
    if (!z) return;
    open=z;
    var sheet=el.querySelector('#l-sheet');
    sheet.innerHTML=
      '<div class="sheet-head"><div><h2'+((z.name||'').length>18?' class="long"':'')+'>'+
        esc(z.name)+'</h2>'+
        '<div class="street">'+esc(z.addr)+'</div></div>'+
        '<button class="closeb" id="l-x" aria-label="Close">&times;</button></div>'+
      '<div class="coord"><div class="lab">Read to the aircraft</div>'+
        '<div class="val">'+z.lat.toFixed(5)+'<br>'+z.lon.toFixed(5)+'</div>'+
        '<div class="hint" id="l-hint">Tap to copy</div></div>'+
      '<label class="fld"><span>Notes</span><textarea id="l-notes" '+
        'placeholder="Surface, wires, obstructions, gate access, best approach">'+
        esc(z.notes||'')+'</textarea></label>'+
      '<div class="actions"><button class="btn ghost" id="l-nav">Directions</button>'+
        '<button class="btn primary" id="l-save">Save</button></div>'+
      '<div class="kv"><b>record</b><span>'+esc(z.id)+'</span>'+
        '<b>updated</b><span>'+esc(z.updated||'never')+'</span></div>';
    sheet.classList.add('open');

    sheet.querySelector('#l-x').onclick=closeSheet;
    sheet.querySelector('.coord').onclick=function () {
      var txt=z.lat.toFixed(5)+', '+z.lon.toFixed(5);
      var hint=sheet.querySelector('#l-hint');
      if (navigator.clipboard) navigator.clipboard.writeText(txt)
        .then(function () { hint.textContent='Copied'; })
        .catch(function () { hint.textContent='Copy blocked by the browser'; });
      else hint.textContent='Clipboard not available';
    };
    sheet.querySelector('#l-nav').onclick=function () {
      window.open('https://www.google.com/maps/dir/?api=1&destination='+z.lat+','+z.lon,'_blank');
    };
    sheet.querySelector('#l-save').onclick=save;
  }

  function closeSheet() {
    var sheet=el&&el.querySelector('#l-sheet');
    if (sheet) sheet.classList.remove('open');
    open=null;
  }

  function save() {
    if (!open) return;
    var sheet=el.querySelector('#l-sheet');
    sheet.querySelector('#l-save').disabled=true;
    var patch={notes:sheet.querySelector('#l-notes').value.trim(),
      updated:new Date().toISOString().slice(0,16).replace('T',' ')};
    Object.assign(open,patch);
    var rec=open;
    DB.putRecord('lz',rec)
      .then(function () { return SYNC.edit('lz',rec.id,patch); })
      .then(function (res) {
        closeSheet();
        if (mode==='near') renderList(); else drawPins();
        say(res?'Saved and synced.':'Saved on this device.');
        paintQueue();
      });
  }

  function reload() {
    return DB.getRecords('lz').then(function (r) {
      rows=r;
      if (el) { if (mode==='near') renderList(); else drawPins(); }
    });
  }
  function all() { return rows; }

  return {id:'lz', title:'LZ',
    icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/>'+
      '<path d="M9 8v8M15 8v8M9 12h6"/></svg>',
    mount:mount, unmount:unmount, reload:reload, all:all};
})();

/* ============================================================
   SETUP
   ============================================================ */
var SET = (function () {
  var el=null;
  function mount(root) {
    el=root;
    return Promise.all([DB.getMeta('endpoint',''),DB.getMeta('sync:hydrants',''),
      DB.getRecords('hydrants'),DB.queueCount(),DB.getRecords('lz'),
      DB.getMeta('seed','')]).then(function (r) {
      var url=r[0], last=r[1], recs=r[2], pending=r[3], lzcount=r[4].length, seedv=r[5];
      if (url) SYNC.setEndpoint(url);

      var byZone={}, flagged={}, oos=0, edited=0;
      recs.forEach(function (h) {
        byZone[h.zone||'']=(byZone[h.zone||'']||0)+1;
        if (h.status==='oos') oos++;
        if (h.updated) edited++;
        (h.flags?h.flags.split(','):[]).forEach(function (f) { flagged[f]=(flagged[f]||0)+1; });
      });

      el.innerHTML='<div class="pane settings">'+
        '<h2>Data</h2>'+
        '<div class="row"><div class="lab"><b>Records on this device</b>'+
          '<small>Hyd_App.xlsx, Master List</small></div>'+
          '<div class="val">'+recs.length+'</div></div>'+
        '<div class="row"><div class="lab"><b>Data file</b>'+
          '<small>'+(seedv===SEED_VERSION?'current':'older than this app — reload below')+
          '</small></div><div class="val">'+esc(seedv||'none')+'</div></div>'+
        '<div class="row"><div class="lab"><b>Edited here</b>'+
          '<small>Changed since the file was loaded</small></div><div class="val">'+edited+'</div></div>'+
        '<div class="row"><div class="lab"><b>Out of service</b></div><div class="val">'+oos+'</div></div>'+

        '<h2>Our zones</h2>'+
        TOWN_ZONES.filter(function (z) { return byZone[z]; }).map(function (z) {
          return '<div class="row"><i class="sw" style="background:'+ZCOLOR[z]+'"></i>'+
            '<div class="lab"><b>'+z+'</b></div>'+
            '<div class="val">'+byZone[z]+'</div></div>';
        }).join('')+
        '<h2>Mutual aid</h2>'+
        '<p>Neighboring systems, carried for mutual aid. Not on Rockaway Township water.</p>'+
        AID_ZONES.filter(function (z) { return byZone[z]; }).map(function (z) {
          return '<div class="row"><i class="sw" style="background:'+ZCOLOR[z]+'"></i>'+
            '<div class="lab"><b>'+z+'</b></div>'+
            '<div class="val">'+byZone[z]+'</div></div>';
        }).join('')+
        (byZone[''] ? '<div class="row"><i class="sw" style="background:'+ZCOLOR['']+'"></i>'+
          '<div class="lab"><b>No zone assigned</b></div><div class="val">'+byZone['']+'</div></div>' : '')+

        '<h2>Needs review</h2>'+
        '<p>Tap <b>Needs review</b> on the Hydrants tab to work through these.</p>'+
        [['no#','No hydrant number'],['dup#','Duplicate numbers'],
         ['dupXY','Same coordinates as another']]
        .map(function (f) {
          return '<div class="row"><div class="lab"><b>'+f[1]+'</b></div>'+
            '<div class="val">'+(flagged[f[0]]||0)+'</div></div>';
        }).join('')+
        '<div class="row"><div class="lab"><b>No coordinates</b>'+
          '<small>7 rows in the workbook could not be placed and are not in the app</small></div>'+
          '<div class="val">7</div></div>'+

        '<h2>Sync</h2>'+
        '<label class="fld"><span>Apps Script web app URL</span>'+
          '<input id="s-url" type="url" inputmode="url" '+
          'placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(url)+'"></label>'+
        '<div class="actions"><button class="btn ghost" id="s-save">Save URL</button>'+
          '<button class="btn primary" id="s-sync">Sync now</button></div>'+
        '<div class="row"><div class="lab"><b>Last sync</b><small>'+
          (last?esc(String(last).replace('T',' ').slice(0,16)):'never')+'</small></div>'+
          '<div class="val">'+pending+' queued</div></div>'+

        '<h2>Landing zones</h2>'+
        '<div class="row"><i class="sw" style="background:var(--lz)"></i>'+
          '<div class="lab"><b>Landing zones</b><small>LZ_App.xlsx</small></div>'+
          '<div class="val">'+lzcount+'</div></div>'+

        '<h2>Export</h2>'+
        '<p>Copies every record as JSON, including your edits — paste it back into the '+
          'workbook or keep it as a backup.</p>'+
        '<div class="actions"><button class="btn ghost" id="s-reset">Reset to file</button>'+
          '<button class="btn primary" id="s-export">Copy all records</button></div>'+
        '</div>';

      el.querySelector('#s-save').onclick=function () {
        var v=el.querySelector('#s-url').value.trim();
        SYNC.setEndpoint(v);
        DB.setMeta('endpoint',v).then(function () { say(v?'Endpoint saved.':'Endpoint cleared.'); });
      };
      el.querySelector('#s-sync').onclick=function (e) {
        e.target.disabled=true;
        SYNC.run('hydrants').then(function (res) {
          say('Synced. Sent '+res.pushed+', received '+res.pulled+'.');
          return HYD.reload();
        }).catch(function (err) { say(err.message); })
          .then(function () { e.target.disabled=false; paintQueue(); });
      };
      el.querySelector('#s-export').onclick=function () {
        Promise.all([DB.getRecords('hydrants'),DB.getRecords('lz')]).then(function (out) {
          var rs=out[0];
          var text=JSON.stringify({version:SEED_VERSION,rows:rs,
            landingZones:out[1]},null,1);
          if (navigator.clipboard) navigator.clipboard.writeText(text)
            .then(function () { say('Copied '+rs.length+' records.'); })
            .catch(function () { say('Clipboard blocked — use a desktop browser.'); });
          else say('Clipboard not available in this browser.');
        });
      };
      el.querySelector('#s-reset').onclick=function () {
        if (!confirm('Reload all '+SEED.length+' water supply records and '+LZ_SEED.length+
          ' landing zones from the file? Edits made on this device are lost.')) return;
        DB.clearModule('hydrants')
          .then(function () { return DB.putRecords('hydrants',SEED); })
          .then(function () { return DB.setMeta('seed',SEED_VERSION); })
          .then(function () { return DB.clearModule('lz'); })
          .then(function () { return DB.putRecords('lz',LZ_SEED); })
          .then(function () { return DB.setMeta('lzseed',LZ_VERSION); })
          .then(function () { return HYD.reload(); })
          .then(function () { return LZ.reload(); })
          .then(function () { say('Reloaded from file.'); return mount(el); });
      };
    });
  }
  function unmount() { el=null; }
  return {id:'settings', title:'Setup',
    icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>',
    mount:mount, unmount:unmount};
})();

/* ---------- shell ---------- */
var MODULES=[HYD,LZ,SET], current=null;
var view=document.getElementById('view'), tabs=document.getElementById('tabs');
var netEl=document.getElementById('net'), badge=document.getElementById('queue');

tabs.innerHTML=MODULES.map(function (m) {
  return '<button data-id="'+m.id+'" aria-current="false">'+m.icon+'<span>'+m.title+'</span></button>';
}).join('');
tabs.addEventListener('click',function (e) {
  var b=e.target.closest('button'); if (b) go(b.getAttribute('data-id'));
});

function go(id) {
  var m=null;
  MODULES.forEach(function (x) { if (x.id===id) m=x; });
  if (!m || (current && current.id===id)) return Promise.resolve();
  if (current && current.unmount) current.unmount();
  view.innerHTML='';
  current=m;
  Array.prototype.forEach.call(tabs.querySelectorAll('button'),function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-id')===id?'page':'false');
  });
  return Promise.resolve(m.mount(view)).catch(function (err) {
    view.innerHTML='<div class="pane"><div class="empty"><strong>Could not open '+esc(m.title)+
      '</strong>'+esc(err&&err.message?err.message:String(err))+'</div></div>';
  });
}

function paintNet() {
  netEl.setAttribute('data-net', navigator.onLine?'on':'off');
  netEl.title=navigator.onLine?'Online':'Offline — edits are saved on the device';
}
function paintQueue() {
  return DB.queueCount().then(function (n) {
    badge.hidden=n===0; badge.textContent=n+' to send';
  });
}
window.addEventListener('online',function () { paintNet(); drain(); });
window.addEventListener('offline',paintNet);
function drain() {
  if (!SYNC.configured()) return;
  SYNC.run('hydrants').then(function (r) {
    if (r.pushed) say('Sent '+r.pushed+' saved edit'+(r.pushed===1?'':'s')+'.');
    return HYD.reload();
  }).catch(function () {})
    .then(function () { return SYNC.run('lz').then(LZ.reload).catch(function () {}); })
    .then(paintQueue);
}

paintNet();
DB.getMeta('endpoint','').then(function (url) {
  if (url) SYNC.setEndpoint(url);
  return paintQueue();
}).then(function () { return go(MODULES[0].id); })
  .then(function () { if (navigator.onLine) drain(); })
  .catch(function (err) {
    view.innerHTML='<div class="pane"><div class="empty"><strong>Startup failed</strong>'+
      esc(err&&err.message?err.message:String(err))+'</div></div>';
  });
})();
</script>
</body>
